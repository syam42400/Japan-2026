<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajouter une photo · Japon 2026</title>
<style>
:root{
  --paper:#faf7f2; --card:#fff; --ink:#26262e; --ink2:#54525c; --muted:#827d78;
  --line:#e7e0d6; --line2:#f1ece4; --gold:#9a7420;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#141416;--card:#1d1d20;--ink:#f0eeea;--ink2:#c3c0bb;--muted:#94908b;
        --line:#333236;--line2:#28282c;--gold:#d8b45e}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
header.cover{background:linear-gradient(150deg,#241d3a,#3d2a4d 42%,#6b2f3d);color:#fff;padding:26px 20px 22px}
header.cover a{color:#fff;opacity:.75;font-size:.8rem;text-decoration:none}
header.cover h1{font-family:ui-serif,Georgia,serif;font-size:1.3rem;font-weight:600;margin-top:8px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 17px;margin-bottom:16px}
.step h2{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:10px}
select, input[type=file]{width:100%;font:inherit;padding:10px 11px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
label.chk{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink2);margin-top:12px}
.filerow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.filerow:last-child{border:none}
.filerow img{width:46px;height:46px;object-fit:cover;border-radius:6px;flex:0 0 auto;background:var(--line2)}
.filerow .meta{flex:1;min-width:0}
.filerow .name{font-size:.82rem;color:var(--ink2);word-break:break-all}
.filerow .arrow{font-size:.7rem;color:var(--muted)}
.filerow .newname{font-size:.82rem;color:var(--gold);font-weight:600;word-break:break-all}
button.primary{width:100%;background:var(--gold);color:#fff;border:none;border-radius:9px;padding:13px;font:inherit;font-weight:700;font-size:.92rem;cursor:pointer;margin-top:14px}
button.copy{background:var(--line2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;margin-top:10px}
textarea{width:100%;min-height:64px;margin-top:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--line2);color:var(--ink);resize:vertical}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.upload-names{font-size:.85rem;color:var(--ink2);margin-top:8px}
.upload-names code{background:var(--line2);padding:1px 5px;border-radius:4px;font-size:.8rem}
#out{display:none}
.badge{display:inline-block;background:var(--line2);color:var(--muted);font-size:.7rem;font-weight:700;border-radius:20px;padding:2px 9px;margin-left:6px}
</style>
</head>
<body>
<header class="cover">
  <a href="index.html">← Retour à la carte</a>
  <h1>Ajouter une photo à un jour</h1>
</header>
<div class="wrap">

  <div class="step">
    <h2>1 · Choisis le jour</h2>
    <select id="day"></select>
  </div>

  <div class="step">
    <h2>2 · Choisis une ou plusieurs photos</h2>
    <input type="file" id="files" accept="image/*" multiple>
    <label class="chk"><input type="checkbox" id="clean" checked> Simplifier les noms de fichiers (recommandé)</label>
    <div id="filelist"></div>
  </div>

  <button class="primary" id="gen">Générer le code à coller</button>

  <div class="step" id="out">
    <h2>3 · Colle ceci dans points.json <span class="badge" id="daybadge"></span></h2>
    <p class="hint">Dans points.json, trouve le jour choisi et remplace sa ligne <code>"photos": [...]</code> par :</p>
    <textarea id="snippet" readonly></textarea>
    <button class="copy" id="copybtn">Copier</button>

    <p class="hint" style="margin-top:16px">Puis, sur GitHub, uploade les mêmes photos dans <code>photos/</code> :</p>
    <div class="upload-names" id="uploadnames"></div>
  </div>

</div>

<script>
let DATA = null;
let picked = []; // {file, origName, newName}

function slugify(name){
  const dot = name.lastIndexOf('.');
  const base = dot > -1 ? name.slice(0, dot) : name;
  const ext = dot > -1 ? name.slice(dot).toLowerCase() : '';
  const clean = base.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return (clean || 'photo') + (ext === '.jpeg' ? '.jpg' : ext);
}

function dayLabel(p){
  return `Jour ${p.n} · ${p.date.fr} · ${p.title.fr}`;
}

function populateDays(){
  const sel = document.getElementById('day');
  sel.innerHTML = DATA.points.map((p, idx) =>
    `<option value="${idx}">${dayLabel(p)}</option>`).join('');
}

function renderFileList(){
  const box = document.getElementById('filelist');
  const clean = document.getElementById('clean').checked;
  box.innerHTML = picked.map((f, i) => `
    <div class="filerow">
      <img src="${f.url}" alt="">
      <div class="meta">
        <div class="name">${f.origName}</div>
        ${clean ? `<div class="newname">→ ${f.newName}</div>` : ''}
      </div>
    </div>`).join('');
}

document.getElementById('files').addEventListener('change', e => {
  picked = Array.from(e.target.files).map(file => ({
    file,
    origName: file.name,
    newName: slugify(file.name),
    url: URL.createObjectURL(file)
  }));
  renderFileList();
});
document.getElementById('clean').addEventListener('change', renderFileList);

document.getElementById('gen').addEventListener('click', () => {
  if(!picked.length){ alert('Choisis au moins une photo.'); return; }
  const idx = +document.getElementById('day').value;
  const p = DATA.points[idx];
  const clean = document.getElementById('clean').checked;
  const dayNum = String(p.n).padStart(2,'0');

  const usedNames = picked.map((f,i) => {
    if(!clean) return f.origName;
    let n = f.newName;
    if(!n.startsWith(dayNum + '-')) n = `${dayNum}-${n}`;
    return n;
  });

  const existing = (p.photos || []).slice();
  const all = existing.concat(usedNames.map(n => `photos/${n}`));
  const snippet = `"photos": [${all.map(x => `"${x}"`).join(', ')}]`;

  document.getElementById('daybadge').textContent = dayLabel(p);
  document.getElementById('snippet').value = snippet;
  document.getElementById('uploadnames').innerHTML = picked.map((f,i) =>
    `<div>${clean ? `<code>${f.origName}</code> → renomme en <code>${usedNames[i]}</code>` : `<code>${f.origName}</code> (garde ce nom)`}</div>`
  ).join('');
  document.getElementById('out').style.display = 'block';
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
});

document.getElementById('copybtn').addEventListener('click', () => {
  const ta = document.getElementById('snippet');
  navigator.clipboard.writeText(ta.value).then(() => {
    const b = document.getElementById('copybtn');
    const old = b.textContent; b.textContent = 'Copié ✓';
    setTimeout(() => b.textContent = old, 1500);
  }).catch(() => { ta.select(); document.execCommand('copy'); });
});

fetch('points.json')
  .then(r => r.json())
  .then(json => { DATA = json; populateDays(); })
  .catch(() => {
    document.querySelector('.wrap').innerHTML =
      '<div class="step">Impossible de charger points.json. Ouvre cette page depuis le site publié (GitHub Pages), pas en fichier local.</div>';
  });
</script>
</body>
</html>
