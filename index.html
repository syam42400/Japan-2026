<head>

<style>
:root{
  --paper:#faf7f2; --card:#fff; --ink:#26262e; --ink2:#54525c; --muted:#827d78;
  --line:#e7e0d6; --line2:#f1ece4; --gold:#9a7420;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#141416;--card:#1d1d20;--ink:#f0eeea;--ink2:#c3c0bb;--muted:#94908b;
        --line:#333236;--line2:#28282c;--gold:#d8b45e}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-serif,Georgia,'Iowan Old Style','Times New Roman',serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%}
.sans{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif}
header.cover{background:linear-gradient(150deg,#241d3a,#3d2a4d 42%,#6b2f3d);color:#fff;padding:36px 20px 28px;text-align:center;position:relative;overflow:hidden}
header.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 72% 8%,rgba(255,255,255,.13),transparent 55%)}
header.cover>*{position:relative;z-index:1}
.jp{font-size:.7rem;letter-spacing:8px;opacity:.6;margin-bottom:10px}
h1{font-size:clamp(1.4rem,4.2vw,2rem);font-weight:600;line-height:1.15;letter-spacing:-.4px}
.dates{margin-top:8px;font-size:.92rem;opacity:.9;font-family:ui-sans-serif,sans-serif}
.stats{margin-top:6px;font-size:.78rem;opacity:.75;font-family:ui-sans-serif,sans-serif}
.langbar{display:flex;gap:8px;justify-content:center;margin-top:18px}
.langbar button{font-family:ui-sans-serif,-apple-system,sans-serif;font-size:.78rem;font-weight:600;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 16px;cursor:pointer}
.langbar button[aria-pressed="true"]{background:#fff;color:#3d2a4d;border-color:#fff}
.sharebtn{font-family:ui-sans-serif,-apple-system,sans-serif;font-size:.78rem;font-weight:600;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 16px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--paper);font-family:ui-sans-serif,sans-serif;font-size:.82rem;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:10000;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.wrap{max-width:960px;margin:0 auto;padding:18px 16px 60px}
.welcome{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:13px 16px;margin-bottom:16px;font-style:italic;font-size:.9rem;color:var(--ink2);display:none}
.howto{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--line2);border-radius:10px;padding:11px 14px;margin-bottom:16px;font-size:.8rem;line-height:1.5;color:var(--ink2);display:none}
#map{width:100%;height:64vh;min-height:360px;border-radius:13px;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin:14px 0 22px;font-family:ui-sans-serif,sans-serif;font-size:.78rem;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.dayrow{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;padding:11px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.dayrow:hover{background:var(--line2)}
.dayrow.today{border-color:var(--gold);border-width:2px;background:var(--line2)}
.today-tag{color:var(--gold);font-weight:700}
.dayrow .dn{flex:0 0 auto;width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:ui-sans-serif,sans-serif;font-weight:800;font-size:.82rem}
.dayrow .dt{flex:1;min-width:0}
.dayrow .t{display:block;font-weight:600;font-size:.94rem}
.dayrow .d{display:block;font-size:.74rem;color:var(--muted);font-family:ui-sans-serif,sans-serif;margin-top:1px}
.popupbox{font-family:ui-sans-serif,-apple-system,sans-serif;max-width:230px}
.popupbox h3{font-family:ui-serif,Georgia,serif;font-size:.98rem;margin:2px 0 2px;color:#222}
.popupbox .pd{font-size:.72rem;font-weight:700;letter-spacing:.4px;color:var(--gold);margin-bottom:6px}
.popupbox ul{list-style:none;padding-left:0;margin-top:4px}
.popupbox li{font-size:.8rem;color:#444;padding:3px 0 3px 13px;position:relative;border-bottom:1px solid #eee}
.popupbox li:last-child{border:none}
.popupbox li::before{content:"—";position:absolute;left:0;color:#999}
.popupbox .pnote{margin-top:9px;padding:7px 10px;background:#f4f1ea;border-left:3px solid var(--gold);border-radius:0 6px 6px 0;font-style:italic;font-size:.8rem;color:#3a3a3a}
.sectitle{font-family:ui-sans-serif,sans-serif;font-size:.85rem;font-weight:700;color:var(--muted);margin:26px 0 10px;text-transform:uppercase;letter-spacing:.5px}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:.76rem;color:var(--muted);font-family:ui-sans-serif,sans-serif;line-height:1.6;text-align:center}
.leaflet-popup-content-wrapper{border-radius:10px}
.ppics{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.ppics img{width:52px;height:52px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid #ddd;display:block}
.pcount{display:inline-flex;align-items:center;gap:3px;font-size:.7rem;color:var(--muted);font-family:ui-sans-serif,sans-serif;margin-left:6px}
#lightbox{position:fixed;inset:0;background:rgba(10,10,12,.92);display:none;align-items:center;justify-content:center;z-index:9999;padding:24px;flex-direction:column}
#lightbox.show{display:flex}
#lightbox img{max-width:92vw;max-height:76vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#lightbox .lb-cap{color:#eee;font-family:ui-sans-serif,sans-serif;font-size:.82rem;margin-top:12px;text-align:center}
#lightbox .lb-bar{position:absolute;top:16px;right:18px;display:flex;gap:10px}
#lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:1.2rem;cursor:pointer}
#lightbox .lb-prev{left:14px}
#lightbox .lb-next{right:14px}
#lightbox .lb-close{background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer}
html[lang="km"] body{font-family:'Noto Sans Khmer',ui-sans-serif,sans-serif}
html[lang="km"] .sans,html[lang="km"] .dates,html[lang="km"] .stats,html[lang="km"] .langbar button,
html[lang="km"] .sharebtn,html[lang="km"] .toast,html[lang="km"] .legend,html[lang="km"] .dayrow .dn,
html[lang="km"] .dayrow .d,html[lang="km"] .popupbox,html[lang="km"] .popupbox h3,html[lang="km"] .sectitle,
html[lang="km"] footer,html[lang="km"] #lightbox .lb-cap{font-family:'Noto Sans Khmer',ui-sans-serif,sans-serif}
</style>
</head>
<body>
<header class="cover">
  <div class="jp">日 本 旅 行</div>
  <h1 id="c-title"></h1>
  <p class="dates" id="c-sub"></p>
  <p class="stats" id="c-stats"></p>
  <div class="langbar" id="langbar"></div>
  <div class="langbar" style="margin-top:8px">
    <button type="button" class="sharebtn" id="share-btn">🔗 <span id="share-label"></span></button>
  </div>
</header>
<div class="wrap">
  <p class="welcome" id="c-welcome"></p>
  <p class="howto" id="c-howto"></p>
  <div id="map"></div>
  <div class="legend" id="legend"></div>
  <div class="sectitle" id="sec-days"></div>
  <div id="daylist"></div>
  <footer id="foot"></footer>
</div>

<div id="lightbox">
  <div class="lb-bar"><button class="lb-close" onclick="closeLightbox()">✕</button></div>
  <button class="lb-nav lb-prev" onclick="stepLightbox(-1)">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-nav lb-next" onclick="stepLightbox(1)">›</button>
  <div class="lb-cap" id="lb-cap"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const UI = {
  fr:{loading:'Chargement de la carte…', days:'Jour par jour', foot:'Carte personnelle sans compte ni inscription — hébergée en statique.',
      share:'Partager', shareCopied:'Lien copié !', today:"· aujourd'hui",
      stats:(d,km,ph)=>`${d} jours · ${km} km à vol d'oiseau · ${ph} photo${ph>1?'s':''}`},
  en:{loading:'Loading the map…', days:'Day by day', foot:'A personal map with no account and no sign-up — static hosting.',
      share:'Share', shareCopied:'Link copied!', today:'· today',
      stats:(d,km,ph)=>`${d} days · ${km} km as the crow flies · ${ph} photo${ph>1?'s':''}`},
  nl:{loading:'Kaart laden…', days:'Dag per dag', foot:'Een persoonlijke kaart zonder account of inschrijving — statisch gehost.',
      share:'Delen', shareCopied:'Link gekopieerd!', today:'· vandaag',
      stats:(d,km,ph)=>`${d} dagen · ${km} km in vogelvlucht · ${ph} foto${ph>1?"'s":''}`},
  km:{loading:'កំពុងផ្ទុកផែនទី…', days:'ថ្ងៃម្តងៗ', foot:'ផែនទីផ្ទាល់ខ្លួន គ្មានតម្រូវឱ្យបង្កើតគណនី ឬចុះឈ្មោះ — បង្ហោះជាគេហទំព័រឋិតិវន្ត។',
      share:'ចែករំលែក', shareCopied:'បានចម្លងតំណភ្ជាប់!', today:'· ថ្ងៃនេះ',
      stats:(d,km,ph)=>`${d} ថ្ងៃ · ${km} គីឡូម៉ែត្រ តាមបន្ទាត់ត្រង់ · ${ph} រូបថត`}
};
const TRIP_START = new Date(2026, 8, 11); // 11 septembre 2026
let lang = 'fr';
let DATA = null;
let map, markers = [], polyline;
let todayIdx = null;

function dateForDay(n){
  const d = new Date(TRIP_START);
  d.setDate(d.getDate() + (n - 1));
  d.setHours(0,0,0,0);
  return d;
}
function findTodayIndex(){
  const today = new Date(); today.setHours(0,0,0,0);
  const first = dateForDay(DATA.points[0].n);
  const last = dateForDay(DATA.points[DATA.points.length-1].n);
  if(today < first || today > last) return null;
  let best = 0, bestDiff = Infinity;
  DATA.points.forEach((p, idx) => {
    const diff = Math.abs(dateForDay(p.n) - today);
    if(diff < bestDiff){ bestDiff = diff; best = idx; }
  });
  return best;
}
function haversineKm(lat1,lon1,lat2,lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatKm(km){
  return Math.round(km).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function popupHtml(p, idx){
  const items = p.items.map(i => `<li>${esc(i[lang])}</li>`).join('');
  const note = (p.note && p.note[lang]) ? `<div class="pnote">${esc(p.note[lang])}</div>` : '';
  const pics = (p.photos && p.photos.length)
    ? `<div class="ppics">${p.photos.map((src,i) => `<img src="${esc(src)}" loading="lazy" onclick="openLightbox(${idx},${i})" alt="">`).join('')}</div>`
    : '';
  return `<div class="popupbox">
    <div class="pd">${esc(p.date[lang])} · ${esc(p.place[lang])}</div>
    <h3>${esc(p.title[lang])}</h3>
    <ul>${items}</ul>
    ${note}
    ${pics}
  </div>`;
}

function renderHeader(){
  document.documentElement.lang = lang;
  document.getElementById('c-title').textContent = DATA.trip.title[lang];
  document.getElementById('c-sub').textContent = DATA.trip.sub[lang];
  const flags = {fr:'🇫🇷', en:'🇬🇧', nl:'🇳🇱', km:'🇰🇭'};
  document.getElementById('langbar').innerHTML = ['fr','en','nl','km']
    .map(l => `<button type="button" data-l="${l}" aria-pressed="${l===lang}">${flags[l]} ${l.toUpperCase()}</button>`).join('');
  document.querySelectorAll('#langbar button').forEach(b => b.onclick = () => { lang = b.dataset.l; renderAll(); });
  document.getElementById('foot').textContent = UI[lang].foot;
  document.getElementById('sec-days').textContent = UI[lang].days;
  document.getElementById('share-label').textContent = UI[lang].share;

  const totalKm = DATA.points.slice(1).reduce((sum, p, i) =>
    sum + haversineKm(DATA.points[i].lat, DATA.points[i].lon, p.lat, p.lon), 0);
  const totalPhotos = DATA.points.reduce((sum, p) => sum + (p.photos ? p.photos.length : 0), 0);
  document.getElementById('c-stats').textContent =
    UI[lang].stats(DATA.points.length, formatKm(totalKm), totalPhotos);

  const welcomeEl = document.getElementById('c-welcome');
  const welcomeText = DATA.trip.welcome && DATA.trip.welcome[lang];
  welcomeEl.textContent = welcomeText || '';
  welcomeEl.style.display = welcomeText ? 'block' : 'none';

  const howtoEl = document.getElementById('c-howto');
  const howtoText = DATA.trip.howto && DATA.trip.howto[lang];
  howtoEl.textContent = howtoText || '';
  howtoEl.style.display = howtoText ? 'block' : 'none';
}

function renderLegend(){
  document.getElementById('legend').innerHTML = Object.entries(DATA.legend)
    .filter(([k]) => k !== 'vol')
    .map(([k,v]) => `<span><i style="background:${v.color}"></i>${esc(v.name[lang])}</span>`).join('');
}

function renderDayList(){
  document.getElementById('daylist').innerHTML = DATA.points.map((p,idx) => `
    <div class="dayrow${idx===todayIdx?' today':''}" data-idx="${idx}">
      <span class="dn" style="background:${p.color}">${p.n}</span>
      <span class="dt">
        <span class="t">${esc(p.title[lang])}${p.note && p.note[lang] ? `<span class="pcount">💬</span>` : ''}${p.photos && p.photos.length ? `<span class="pcount">📷 ${p.photos.length}</span>` : ''}</span>
        <span class="d">${esc(p.date[lang])} · ${esc(p.place[lang])}${idx===todayIdx?` <span class="today-tag">${UI[lang].today}</span>`:''}</span>
      </span>
    </div>`).join('');
  document.querySelectorAll('.dayrow').forEach(row => row.onclick = () => {
    const idx = +row.dataset.idx;
    const p = DATA.points[idx];
    map.flyTo([p.lat, p.lon], 8, {duration:.6});
    markers[idx].openPopup();
  });
}

function renderMarkers(){
  DATA.points.forEach((p, idx) => {
    markers[idx].setPopupContent(popupHtml(p, idx));
  });
}

function initMap(){
  map = L.map('map', {scrollWheelZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const latlngs = DATA.points.map(p => [p.lat, p.lon]);
  polyline = L.polyline(latlngs, {color:'#9a7420', weight:2, dashArray:'5 7', opacity:.6}).addTo(map);

  DATA.points.forEach((p, idx) => {
    const icon = L.divIcon({
      className: '',
      html: `<div style="background:${p.color};width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font:700 11px ui-sans-serif,sans-serif">${p.n}</div>`,
      iconSize: [26,26], iconAnchor: [13,13], popupAnchor: [0,-13]
    });
    const m = L.marker([p.lat, p.lon], {icon}).addTo(map).bindPopup(popupHtml(p, idx));
    markers.push(m);
  });

  map.fitBounds(polyline.getBounds(), {padding:[30,30]});
  if(todayIdx !== null){
    const p = DATA.points[todayIdx];
    map.setView([p.lat, p.lon], 9);
    markers[todayIdx].openPopup();
  }
}

function renderAll(){
  renderHeader();
  renderLegend();
  renderDayList();
  renderMarkers();
}

let lb = {pointIdx:null, photoIdx:0};

function showLightboxImage(){
  const p = DATA.points[lb.pointIdx];
  const src = p.photos[lb.photoIdx];
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-cap').textContent = `${p.title[lang]} — ${p.date[lang]} (${lb.photoIdx+1}/${p.photos.length})`;
}
window.openLightbox = function(pointIdx, photoIdx){
  lb.pointIdx = pointIdx; lb.photoIdx = photoIdx;
  showLightboxImage();
  document.getElementById('lightbox').classList.add('show');
};
window.closeLightbox = function(){
  document.getElementById('lightbox').classList.remove('show');
};
window.stepLightbox = function(dir){
  const p = DATA.points[lb.pointIdx];
  lb.photoIdx = (lb.photoIdx + dir + p.photos.length) % p.photos.length;
  showLightboxImage();
};
document.getElementById('lightbox').addEventListener('click', e => {
  if(e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', e => {
  if(!document.getElementById('lightbox').classList.contains('show')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowLeft') stepLightbox(-1);
  if(e.key === 'ArrowRight') stepLightbox(1);
});

document.getElementById('share-btn').addEventListener('click', async () => {
  const shareData = {
    title: DATA ? DATA.trip.title[lang] : document.title,
    text: DATA ? DATA.trip.sub[lang] : '',
    url: location.href
  };
  if(navigator.share){
    try { await navigator.share(shareData); } catch(e){ /* cancelled, ignore */ }
  } else {
    try {
      await navigator.clipboard.writeText(location.href);
      showToast(UI[lang].shareCopied);
    } catch(e){
      prompt('Copie ce lien :', location.href);
    }
  }
});

fetch('points.json')
  .then(r => {
    if(!r.ok) throw new Error('points.json introuvable (statut ' + r.status + ')');
    return r.json();
  })
  .then(json => {
    DATA = json;
    todayIdx = findTodayIndex();
    initMap();
    renderAll();
  })
  .catch(err => {
    document.getElementById('map').innerHTML =
      '<div style="padding:24px;font-family:ui-sans-serif,sans-serif;font-size:.85rem;color:var(--muted)">'
      + 'Impossible de charger points.json (' + esc(err.message) + ').<br>'
      + 'Ouvre ce dossier avec un petit serveur local (ex. <code>python3 -m http.server</code>) plutôt que de double-cliquer le fichier, ou teste directement une fois publié sur GitHub Pages.'
      + '</div>';
  });
</script>
</body>
</html>
